name: iOS Unsigned IPA Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Add iOS platform
        run: |
          npx cap add ios || true
          npx cap sync ios
          echo "=== iOS项目结构 ==="
          ls -la ios/App/

      - name: Build unsigned IPA
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean archive

          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/App.xcarchive/Products/Applications/App.app $RUNNER_TEMP/Payload/
          cd $RUNNER_TEMP
          zip -r OneOS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneOS-unsigned-ipa
          path: ${{ runner.temp }}/OneOS-unsigned.ipa
          retention-days: 30

      - name: Build summary
        run: |
          echo "## iOS IPA 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **文件**: OneOS-unsigned.ipa" >> $GITHUB_STEP_SUMMARY
          echo "- **类型**: 未签名IPA（用于AltStore侧载）" >> $GITHUB_STEP_SUMMARY
          echo "- **下载**: 请在Artifacts中下载" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 安装方法" >> $GITHUB_STEP_SUMMARY
          echo "1. 下载OneOS-unsigned.ipa到iPhone" >> $GITHUB_STEP_SUMMARY
          echo "2. 打开AltStore → My Apps → 点击+号" >> $GITHUB_STEP_SUMMARY
          echo "3. 选择OneOS-unsigned.ipa" >> $GITHUB_STEP_SUMMARY
          echo "4. 等待签名安装完成" >> $GITHUB_STEP_SUMMARY
